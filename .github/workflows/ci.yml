name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/voice/requirements*.txt
      - name: Install dependencies
        run: pip install -r apps/voice/requirements-dev.txt
      - name: Lint
        run: ruff check --config apps/voice/pyproject.toml .
      - name: Test
        working-directory: apps/voice
        run: pytest
