name: CI

on: [push]

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and a moving image is
    # one more way for a green build to go red without a code change.
    runs-on: ubuntu-24.04
    # A hung test would otherwise hold the runner for GitHub's default 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/voice/requirements*.txt
            apps/voice/constraints.txt
      # The `local` extra (mic and speaker) pulls in pyaudio, which has no Linux
      # wheel and must compile against PortAudio's headers. Without this the
      # install step fails and neither lint nor tests ever run.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - name: Install dependencies
        run: pip install -r apps/voice/requirements-dev.txt
      - name: Lint
        run: ruff check --config apps/voice/pyproject.toml .
      - name: Test
        working-directory: apps/voice
        run: pytest
